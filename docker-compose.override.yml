version: '3.4'

services:
  eshopwebmvc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMq__Host=rabbitmq
      - OrderingApi__BaseUrl=http://orderingapi:8080/
    ports:
      - "5106:8080"
    volumes:
      - ~/.aspnet/https:/root/.aspnet/https:ro
      - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro

  eshoppublicapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5200:8080"
    volumes:
      - ~/.aspnet/https:/root/.aspnet/https:ro
      - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro

  orderingapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__OrderingDb=Data Source=/app/data/ordering.db
    ports:
      - "5300:8080"
    volumes:
      - ordering-data:/app/data

volumes:
  ordering-data:
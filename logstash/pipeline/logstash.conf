# A Logstash pipeline has three stages: input -> filter -> output.

input {
  # Your app (or send-test-log.ps1) writes one JSON object per line to TCP 5000.
  tcp {
    port  => 5000
    codec => json_lines
  }

  # Filebeat ships log files here.
  beats {
    port => 5044
  }
}

filter {
  # Tag every event so you can tell where it came from in Kibana.
  mutate {
    add_field => { "pipeline" => "elk-dev" }
  }

  # If the app sends its own "timestamp" field, use it as the event time.
  if [timestamp] {
    date {
      match  => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"   # one index per day
  }

  # Uncomment to also print every event in `docker compose logs logstash`.
  # stdout { codec => rubydebug }
}
